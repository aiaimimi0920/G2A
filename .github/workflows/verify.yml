name: Protocol reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-js-schema.mjs --check
      - run: npm ci --ignore-scripts
        working-directory: sdk/javascript
      - run: npm test
        working-directory: sdk/javascript
      - run: npm pack --pack-destination ${{ runner.temp }}
        working-directory: sdk/javascript
      - run: python -m unittest discover -s tests -v
      - run: python examples/key_quest.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
